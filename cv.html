<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tommaso Mattiuzzi – CV</title>
  <!-- Google Fonts for Playfair Display (serif) and Inter (sans) -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            accent: '#a7c957', // sage green
          },
        },
      },
    };
  </script>
</head>
<body class="bg-stone-50 text-stone-900 max-w-3xl mx-auto py-12 px-6">
  <!-- Navigation -->
  <nav class="flex justify-between items-center mb-12 border-b border-stone-200 pb-4">
    <h1 class="font-serif text-3xl md:text-4xl tracking-wider uppercase font-light text-stone-900">Tommaso Mattiuzzi</h1>
    <ul class="flex space-x-6 font-sans text-base text-emerald-700">
      <li><a href="index.html" class="hover:underline">Home</a></li>
      <li><a href="cv.html" class="hover:underline">CV</a></li>
    </ul>
  </nav>

  <section class="mt-8">
    <h2 class="font-serif text-2xl font-semibold text-emerald-700 mb-4 border-b border-stone-200 pb-2">Curriculum Vitae</h2>
    <!-- Embed the PDF CV – browsers will display it inline if supported -->
    <embed src="cv.pdf" type="application/pdf" width="100%" height="900px" class="border border-stone-200 rounded-3xl" />
    <!-- Fallback link if embed fails -->
    <p class="mt-4 font-sans text-stone-800">If the PDF does not display, you can download it <a href="cv.pdf" class="text-emerald-700 hover:underline">here</a>.</p>
  </section>
</body>
</html>
